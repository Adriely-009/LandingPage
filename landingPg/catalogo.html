<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muffatão - Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/image.png" type="imagens/image.png">
    <link rel="shortcut icon" href="imagens/logo-muffatao.png" type="image/x-icon">
</head>

<body>
    <header class="header">
        <div class="header-logo-container">
            <img src="imagens/muffatao.png" alt="Muffatão O Super do Coração" class="logo-principal" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <img src="imagens/selo-1964.png" alt="Selo Grupo Muffatão 1964" class="logo-selo">
        </div>
        <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Quero me cadastrar no Clube do Coração</button>
        <div class="icon">
            <button class="botao" onclick="window.location.href='cadastro.html'"><img src="imagens/entrar.png" alt="Entrar"></button>
            <button class="botao" onclick="window.location.href='catalogo.html'"><img src="imagens/carrinho.png" alt="Carrinho"></button>
        </div>
    </header>

    <!-- Barra de Categorias Dinâmica -->
    <nav class="categories-bar">
        <div id="categories-container" class="categories-scroll">
            <!-- Gerado via JS -->
        </div>
    </nav>

    <!-- Área de Produtos -->
    <main class="container-catalogo">
        <h2 class="titulo-secao">Nosso Catálogo</h2>
        <div id="product-grid" class="product-grid">
            <!-- Cards vindos do Firestore -->
        </div>
    </main>

    <footer class="rodape-muffatao">
        <div class="rodape-container">
          <div class="rodape-coluna telefones">
            <h3>Telefones</h3>
            <ul>
              <li><strong>Matriz:</strong> (45) 3112-2121</li>
              <li><strong>Neva:</strong> (45) 3333-7171</li>
              <li><strong>West Side:</strong> (45) 3333-5151</li>
              <li><strong>Cancelli:</strong> (45) 3333-3131</li>
              <li><strong>Santa Cruz:</strong> (45) 3112-6161</li>
            </ul>
          </div>

          <div class="rodape-coluna central">
            <div class="caixa-logo">
              <img src="imagens/muffatao.png" alt="Muffatão O Super do Coração" class="logo-rodape">
            </div>
            <div class="icones-sociais">
              <a href="#" class="icone-fb" aria-label="Facebook">Facebook</a>
              <a href="#" class="icone-ig" aria-label="Instagram">Instagram</a>
            </div>
          </div>
      
          <div class="rodape-coluna info">
            <h3>Horário de Atendimento</h3>
            <p>Seg. à Sáb. das 8h às 21h</p>
            <p>Domingo das 8h às 20h</p>
            <p class="direitos-autorais">&copy; Copyright Muffatão.</p>
          </div>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
